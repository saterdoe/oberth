name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    name: Release contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/release-check.mjs

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: artifacts/coverage
          if-no-files-found: warn

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    env:
      OBERTH_PERF_REPORT: ${{ github.workspace }}/artifacts/performance/go-performance.json
      OBERTH_UI_BUDGET_REPORT: ${{ github.workspace }}/artifacts/performance/ui-bundle.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm --prefix ui ci
      - run: npm run test:performance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-reports
          path: artifacts/performance
          if-no-files-found: error

  portable-cli:
    name: Portable setup smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build CLI and local service with the setup script
        run: ./scripts/setup-cli.sh
      - name: Smoke-test installed commands
        run: |
          ./bin/oberth version
          ./bin/oberth-server -h

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./internal/api ./internal/gateway ./internal/toolrunner ./pkg/git

  durable-e2e:
    name: Durable E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags e2e ./internal/api -run TestDurableRunHTTPHappyPath -count=1

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-e2e-failure
          path: artifacts/e2e
          if-no-files-found: error

  architecture-smoke:
    name: Smoke (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64, suffix: ""}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64, suffix: ""}
          - {os: macos-15-intel, goos: darwin, goarch: amd64, suffix: ""}
          - {os: macos-14, goos: darwin, goarch: arm64, suffix: ""}
          - {os: windows-2022, goos: windows, goarch: amd64, suffix: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build supported target
        shell: bash
        run: ./scripts/build-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" smoke
      - name: Execute native smoke tests
        shell: bash
        run: |
          ./smoke/oberth-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} version
          ./smoke/oberth-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} -h

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm --prefix extensions/vscode ci
      - run: npm run test:extension
      - run: npm run test:release-workflow
