name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    name: Release contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/release-check.mjs

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: artifacts/coverage
          if-no-files-found: warn

  architecture-smoke:
    name: Smoke (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64, suffix: ""}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64, suffix: ""}
          - {os: macos-15-intel, goos: darwin, goarch: amd64, suffix: ""}
          - {os: macos-14, goos: darwin, goarch: arm64, suffix: ""}
          - {os: windows-2022, goos: windows, goarch: amd64, suffix: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build supported target
        shell: bash
        run: ./scripts/build-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" smoke
      - name: Execute native smoke tests
        shell: bash
        run: |
          ./smoke/oberth-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} version
          ./smoke/oberth-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} -h
