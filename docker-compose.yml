services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oberth
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: oberth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oberth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oberth -d oberth"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - oberth-qdrant:/qdrant/storage

volumes:
  oberth-postgres:
  oberth-qdrant:
