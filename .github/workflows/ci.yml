name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The desktop package embeds generated UI assets, which are built by the
      # Web contracts job. Test the source packages here without requiring a
      # generated frontend/dist directory in a clean checkout.
      - run: go test ./cmd/... ./internal/... ./pkg/...
      - run: go build ./cmd/oberth ./cmd/oberth-server

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./internal/api ./internal/gateway ./internal/toolrunner ./pkg/git

  durable-e2e:
    name: Durable E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags e2e ./internal/api -run TestDurableRunHTTPHappyPath -count=1

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: artifacts/coverage
          if-no-files-found: warn

  web:
    name: Web contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run version:check
      - run: npm test
      - run: npm run build:all
      - run: npm run test:docs
