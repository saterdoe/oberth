name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: ""
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            suffix: ""
          - os: macos-14
            goos: darwin
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          ./scripts/build-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" dist
          ./dist/oberth-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} version
          ./dist/oberth-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} -h
          cd dist
          sha256sum * > SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: oberth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
