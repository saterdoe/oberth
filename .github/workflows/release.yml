name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            suffix: ""
          - os: macos-latest
            goos: darwin
            suffix: ""
          - os: windows-latest
            goos: windows
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version contract
        shell: bash
        run: |
          node scripts/version.mjs
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          VERSION="$(tr -d '\r\n' < VERSION)"
          go build -trimpath -ldflags="-s -w -X github.com/saterdoe/oberth/internal/buildinfo.Version=${VERSION}" -o "dist/oberth${{ matrix.suffix }}" ./cmd/oberth
          go build -trimpath -ldflags="-s -w -X github.com/saterdoe/oberth/internal/buildinfo.Version=${VERSION}" -o "dist/oberth-server${{ matrix.suffix }}" ./cmd/oberth-server
          cd dist
          sha256sum * > SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: oberth-${{ matrix.goos }}
          path: dist/*
